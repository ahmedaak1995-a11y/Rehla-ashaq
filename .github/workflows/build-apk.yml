name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Detect Android Project and Gradle Wrapper
        id: detect-project
        run: |
          echo "Detecting Android project root and Gradle wrapper..."
          WRAPPER_PATH=""
          PROJECT_ROOT=""

          # Search for gradlew in repository root or subdirectories (depth 3)
          if [ -f "./gradlew" ]; then
            WRAPPER_PATH="./gradlew"
            PROJECT_ROOT="."
          else
            FOUND_WRAPPER=$(find . -maxdepth 3 -name "gradlew" -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND_WRAPPER" ]; then
              WRAPPER_PATH="$FOUND_WRAPPER"
              PROJECT_ROOT="$(dirname "$FOUND_WRAPPER")"
            fi
          fi

          if [ -z "$WRAPPER_PATH" ] || [ ! -f "$WRAPPER_PATH" ]; then
            echo "::error::Gradle wrapper (gradlew) could not be found in the repository."
            exit 1
          fi

          echo "Found project root: $PROJECT_ROOT"
          echo "Found Gradle wrapper: $WRAPPER_PATH"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          # Detect application module by inspecting settings.gradle or settings.gradle.kts
          APP_MODULE=""
          SETTINGS_FILE=""
          if [ -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            SETTINGS_FILE="$PROJECT_ROOT/settings.gradle.kts"
          elif [ -f "$PROJECT_ROOT/settings.gradle" ]; then
            SETTINGS_FILE="$PROJECT_ROOT/settings.gradle"
          fi

          if [ -n "$SETTINGS_FILE" ]; then
            # Extract included modules, prioritizing :app or modules applying com.android.application
            for mod in $(grep -oE "include\(['\"]:?[a-zA-Z0-9_-]+['\"]\)" "$SETTINGS_FILE" | sed -E "s/include\(['\"]:?([^'\"]+)['\"]\)/\1/"); do
              MOD_DIR="$PROJECT_ROOT/$mod"
              if [ -f "$MOD_DIR/build.gradle.kts" ] || [ -f "$MOD_DIR/build.gradle" ]; then
                if grep -Eq "com\.android\.application|alias\(libs\.plugins\.android\.application\)" "$MOD_DIR/build.gradle"* 2>/dev/null; then
                  APP_MODULE="$mod"
                  break
                fi
              fi
            done
          fi

          # Fallback check for standard app directory
          if [ -z "$APP_MODULE" ]; then
            if [ -d "$PROJECT_ROOT/app" ] && { [ -f "$PROJECT_ROOT/app/build.gradle.kts" ] || [ -f "$PROJECT_ROOT/app/build.gradle" ]; }; then
              APP_MODULE="app"
            fi
          fi

          if [ -z "$APP_MODULE" ]; then
            echo "::error::Android application module could not be found."
            exit 1
          fi

          echo "Detected application module: $APP_MODULE"
          echo "app_module=$APP_MODULE" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: |
          chmod +x "${{ steps.detect-project.outputs.project_root }}/gradlew"

      - name: Ensure Debug Keystore Exists
        working-directory: ${{ steps.detect-project.outputs.project_root }}
        run: |
          # If debug.keystore is referenced in build configurations and missing, create it
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

      - name: Clean stale caches and build outputs
        working-directory: ${{ steps.detect-project.outputs.project_root }}
        run: |
          echo "Removing safe-to-recreate stale caches..."
          rm -rf .gradle
          rm -rf "${{ steps.detect-project.outputs.app_module }}/build"
          echo "Caches cleaned successfully."

      - name: Build Debug APK
        working-directory: ${{ steps.detect-project.outputs.project_root }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Verify Generated APK
        id: locate-apk
        working-directory: ${{ steps.detect-project.outputs.project_root }}
        run: |
          MODULE_BUILD_DIR="${{ steps.detect-project.outputs.app_module }}/build"
          echo "Searching for generated debug APK in $MODULE_BUILD_DIR/outputs/apk/debug/..."

          # Find all APK files in the module build outputs
          APK_FILES=$(find "$MODULE_BUILD_DIR/outputs/apk/debug" -type f -name "*.apk" 2>/dev/null || true)

          if [ -z "$APK_FILES" ]; then
            # Wider search inside the module's build directory just in case
            APK_FILES=$(find "$MODULE_BUILD_DIR" -type f -name "*debug*.apk" 2>/dev/null || true)
          fi

          if [ -z "$APK_FILES" ]; then
            echo "::error::No debug APK found in module build outputs ($MODULE_BUILD_DIR)."
            exit 1
          fi

          echo "Found APK(s):"
          echo "$APK_FILES"

          # Verify at least one file is non-empty
          VALID_APK=false
          for apk in $APK_FILES; do
            if [ -s "$apk" ]; then
              VALID_APK=true
              echo "Validated non-empty APK file: $apk ($(du -h "$apk" | cut -f1))"
            fi
          done

          if [ "$VALID_APK" = false ]; then
            echo "::error::Generated APK file is empty or invalid."
            exit 1
          fi

          # Prepare directory for artifact upload containing only APK files
          UPLOAD_DIR="$RUNNER_TEMP/apk-artifacts"
          mkdir -p "$UPLOAD_DIR"
          for apk in $APK_FILES; do
            cp "$apk" "$UPLOAD_DIR/"
          done

          echo "upload_dir=$UPLOAD_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ steps.locate-apk.outputs.upload_dir }}/*.apk
          if-no-files-found: error
